version: 0.2

env:
  variables:
    EC2_USER: ec2-user                             # For Amazon Linux (use ubuntu for Ubuntu)
    EC2_HOST: "YOUR_EC2_PUBLIC_OR_PRIVATE_IP"      # Replace with your instance
    DEPLOY_DIR: "/var/www/html"
  parameter-store:
    PRIVATE_KEY: "/codebuild/ec2-private-key"      # Replace with your SSM parameter name

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - yum install -y jq python3 zip unzip

      # Write the SSH private key to a file
      - echo "Setting up SSH key..."
      - mkdir -p ~/.ssh
      - echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa

      # Disable strict host checking for automation
      - echo -e "Host *\n  StrictHostKeyChecking no" > ~/.ssh/config

  pre_build:
    commands:
      - echo "Creating sample Hello World application..."
      - mkdir -p app
      - echo "<h1>Hello World from CodeBuild!</h1>" > app/index.html
      - zip -r hello-world.zip app/

  build:
    commands:
      - echo "Uploading build artifact to S3..."
      - aws s3 cp hello-world.zip s3://YOUR_ARTIFACT_BUCKET/hello-world.zip

  post_build:
    commands:
      - echo "Deploying to EC2 instance: $EC2_HOST"

      # Copy artifact to EC2 instance
      - scp hello-world.zip $EC2_USER@$EC2_HOST:/tmp/hello-world.zip

      # Log into EC2 and deploy
      - ssh $EC2_USER@$EC2_HOST << 'EOF'
          echo "Deploying application on EC2..."
          sudo mkdir -p /var/www/html
          sudo unzip -o /tmp/hello-world.zip -d /var/www/html
          sudo chown -R $USER:$USER /var/www/html
          echo "Deployment complete!"
        EOF

artifacts:
  files:
    - hello-world.zip

version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      - yum install -y unzip
      - curl -s -o terraform.zip https://releases.hashicorp.com/terraform/1.5.6/terraform_1.5.6_linux_amd64.zip
      - unzip -o terraform.zip
      - chmod +x terraform
      - mv terraform /usr/bin/terraform
      - terraform version

  build:
    commands:
      - cd terraform
      - terraform init
      - terraform apply -auto-approve
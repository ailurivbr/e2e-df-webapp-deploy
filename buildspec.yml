version: 0.2

phases:
  install:
    commands:
      - echo "Downloading Terraform..."
      - curl -s -L -o terraform.zip https://releases.hashicorp.com/terraform/1.5.6/terraform_1.5.6_linux_amd64.zip

      - echo "Unzipping Terraform..."
      - unzip -o terraform.zip

      - echo "Moving Terraform binary..."
      - mv terraform /usr/local/bin/terraform
      - chmod +x /usr/local/bin/terraform

  build:
    commands:
      - echo "Running Terraform inside terraform/ directory..."
      - cd terraform
      - terraform init
      - terraform apply -auto-approve
